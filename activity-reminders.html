<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动提醒中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #eaf7ff 50%, #e0efff 100%);
    min-height: 100vh;
    padding: 24px 16px 60px;
    color: #2d4a6b;
  }
  .container { max-width: 760px; margin: 0 auto; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .top-bar h1 {
    font-size: 28px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #2f7fc4, #55a8e8, #7fc4f5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .back-link {
    font-size: 13px;
    color: #3d83c6;
    text-decoration: none;
    background: rgba(255,255,255,.9);
    border: 1px solid #c4e0f7;
    padding: 8px 16px;
    border-radius: 999px;
    transition: all .2s;
    white-space: nowrap;
  }
  .back-link:hover { background: #4a9fe0; border-color: #4a9fe0; color: #fff; }

  .chibi-float {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 10px 26px rgba(90, 169, 230, .4);
    object-fit: cover;
    background: #fff;
    z-index: 60;
    pointer-events: none;
    animation: chibiFloat 3.4s ease-in-out infinite;
  }
  @keyframes chibiFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  .countdown-card {
    background: linear-gradient(120deg, #4a90d9 0%, #6cb4ee 55%, #8fcbf7 100%);
    border-radius: 18px;
    padding: 22px 26px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(74, 144, 217, .35);
    margin-bottom: 16px;
    text-align: center;
  }
  .cd-title { font-size: 13px; opacity: .88; letter-spacing: 2px; }
  .cd-time { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 2px; margin: 6px 0; }
  .cd-course { font-size: 15px; opacity: .95; }

  .card {
    background: rgba(255,255,255,.94);
    border: 1px solid #dbeaf8;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(90, 169, 230, .12);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 16px;
    color: #2f7fc4;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .remind-master {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f0f7ff;
    border: 1px solid #cfe2f5;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 700;
    color: #3d83c6;
  }
  .remind-master label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .remind-master input { width: 18px; height: 18px; accent-color: #4a9fe0; cursor: pointer; }
  .btn-mini {
    border: 1px solid #b9d8f2;
    background: #fff;
    color: #3d83c6;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-mini:hover { background: #5aa9e6; border-color: #5aa9e6; color: #fff; }
  .time-choices { display: flex; gap: 12px; flex-wrap: wrap; }
  .time-choices label {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #4a6a8c; cursor: pointer;
    background: #f7fbff; border: 1px solid #dbeaf8;
    padding: 7px 12px; border-radius: 999px;
  }
  .time-choices input { accent-color: #4a9fe0; cursor: pointer; }
  .hint-line { font-size: 12px; color: #8ba3bd; margin-top: 10px; }

  /* 铃声设置 */
  .ring-choices { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .ring-choices label {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: #4a6a8c; cursor: pointer;
    background: #f7fbff; border: 1px solid #dbeaf8;
    padding: 9px 14px; border-radius: 999px;
    transition: all .15s;
  }
  .ring-choices label:has(input:checked) { background: #dceeff; border-color: #5aa9e6; color: #2f7fc4; font-weight: 700; }
  .ring-choices input { accent-color: #4a9fe0; cursor: pointer; }
  .ring-custom {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #f7fbff; border: 1px dashed #b9d8f2;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .ring-custom input[type="file"] { font-size: 12px; color: #4a6a8c; max-width: 240px; }
  .ring-custom .file-name { font-size: 12px; color: #3d83c6; font-weight: 700; word-break: break-all; }
  .ring-tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-danger-mini {
    border: 1px solid #f0bcc9;
    background: #fff;
    color: #c94f6d;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-danger-mini:hover { background: #c94f6d; color: #fff; }

  /* 活动列表 */
  .r-list {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #e3eef9;
    border-radius: 12px;
  }
  .r-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #eef5fc;
  }
  .r-item:last-child { border-bottom: none; }
  .r-item:hover { background: #f0f7ff; }
  .r-item input { width: 16px; height: 16px; accent-color: #4a9fe0; cursor: pointer; flex-shrink: 0; }
  .r-item .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .r-item .sub { display: block; color: #8ba3bd; font-size: 12px; margin-top: 1px; }
  .ev-main { flex: 1; min-width: 0; }
  .ev-item.past { opacity: .5; }
  .ev-del {
    border: 1px solid #f0bcc9;
    background: #fff;
    color: #c94f6d;
    font-size: 11px;
    padding: 4px 11px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .ev-del:hover { background: #c94f6d; color: #fff; }
  .search-empty { padding: 14px; font-size: 13px; color: #8ba3bd; text-align: center; }

  /* 添加活动表单 */
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 13px; color: #6a87a5; margin-bottom: 5px; }
  .form-row input[type="text"] {
    width: 100%;
    border: 1px solid #cfe2f5;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    background: #f7fbff;
    color: #2d4a6b;
  }
  .form-row input[type="date"], .form-row input[type="time"] {
    width: 100%;
    border: 1px solid #cfe2f5;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    background: #f7fbff;
    color: #2d4a6b;
  }
  .form-row input:focus { border-color: #5aa9e6; }
  .form-2col { display: flex; gap: 10px; }
  .form-2col .form-row { flex: 1; }
  .ev-add-btn {
    width: 100%;
    border: none;
    background: linear-gradient(90deg, #4a9fe0, #6cb8f0);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
  }
  .ev-add-btn:hover { transform: translateY(-1px); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(120px);
    background: linear-gradient(90deg, #4a90d9, #6cb8f0);
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(74, 144, 217, .45);
    transition: transform .35s cubic-bezier(.2, .9, .3, 1.2);
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .top-bar h1 { font-size: 22px; letter-spacing: 2px; }
    .chibi-float { width: 74px; height: 74px; right: 12px; bottom: 12px; }
    .cd-time { font-size: 28px; }
    .form-2col { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <h1>活动提醒中心</h1>
    <a class="back-link" href="anime-course-schedule.html">← 返回课程表</a>
  </div>

  <section class="countdown-card">
    <div class="cd-title">距离下一个活动</div>
    <div class="cd-time" id="cdTime">--:--:--</div>
    <div class="cd-course" id="cdCourse">暂无即将开始的活动</div>
  </section>

  <div class="card">
    <h2>♪ 铃声设置</h2>
    <div class="ring-choices" id="ringChoices">
      <label><input type="radio" name="ring" value="chime"> 清脆琶音</label>
      <label><input type="radio" name="ring" value="bell"> 风铃钟声</label>
      <label><input type="radio" name="ring" value="up"> 上行音阶</label>
      <label><input type="radio" name="ring" value="custom"> 自定义音频</label>
    </div>
    <div class="ring-custom" id="ringCustomBox" style="display:none;">
      <input type="file" id="ringFile" accept="audio/*">
      <span class="file-name" id="ringFileInfo">未上传</span>
      <button class="btn-danger-mini" id="ringClear">清除自定义</button>
    </div>
    <div class="ring-tools">
      <button class="btn-mini" id="ringTest">试听铃声 ♪</button>
      <span class="hint-line" style="margin-top:0;">铃声同时用于课程提醒与活动提醒 · 自定义音频需小于 1.5MB</span>
    </div>
  </div>

  <div class="card">
    <h2>🔔 提醒设置</h2>
    <div class="remind-master">
      <label><input type="checkbox" id="evMaster"> 开启活动声音提醒</label>
      <button class="btn-mini" id="evTestBtn">试听当前铃声 ♪</button>
    </div>
    <div class="form-row" style="margin-bottom:0;">
      <label>提前提醒时间（可多选）</label>
      <div class="time-choices">
        <label><input type="checkbox" class="evTime" value="1440"> 1 天</label>
        <label><input type="checkbox" class="evTime" value="120"> 2 小时</label>
        <label><input type="checkbox" class="evTime" value="30"> 30 分钟</label>
        <label><input type="checkbox" class="evTime" value="5"> 5 分钟</label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📅 活动列表（勾选 = 提醒该活动）</h2>
    <div class="r-list" id="evList"></div>
  </div>

  <div class="card">
    <h2>➕ 添加新活动</h2>
    <div class="form-2col">
      <div class="form-row"><label>活动名称 *</label><input type="text" id="evInputName" placeholder="如：动漫社观影会"></div>
      <div class="form-row"><label>日期 *</label><input type="date" id="evInputDate"></div>
    </div>
    <div class="form-2col">
      <div class="form-row"><label>时间</label><input type="time" id="evInputTime" value="19:00"></div>
      <div class="form-row"><label>地点（可选）</label><input type="text" id="evInputLoc" placeholder="如：学生活动中心 201"></div>
    </div>
    <button class="ev-add-btn" id="evAddBtn">＋ 添加活动</button>
  </div>
</div>

<img class="chibi-float" alt="初音未来 Q版"
  src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=chibi%20Hatsune%20Miku%20cute%20anime%20girl%20long%20cyan%20twintails%20turquoise%20eyes%20futuristic%20sailor%20outfit%20cheerful%20smile%20full%20body%20plain%20white%20background%20sticker%20style&image_size=square">

<div class="toast" id="toast"></div>

<script>
// ================= 数据（与课程表页面共享 localStorage） =================
const DEFAULT_EVENTS = [
  { id:"ev01", name:"开学典礼 · 欢迎新同学", date:"2026-09-07", time:"08:00", loc:"学校田径场", color:"#5aa9e6", remind:true },
  { id:"ev02", name:"社团招新 · 动漫社等你哟 ♪", date:"2026-09-14", time:"10:00", loc:"学生活动中心前坪", color:"#f78eb0", remind:true },
  { id:"ev03", name:"动漫社迎新观影会（中野三玖专场）", date:"2026-09-18", time:"19:00", loc:"学生活动中心 201", color:"#9b8ff7", remind:true },
  { id:"ev04", name:"国庆节放假开始（10.1 - 10.7）", date:"2026-10-01", time:"00:01", loc:"全校", color:"#ffa45e", remind:true },
  { id:"ev05", name:"期中教学检查周 · 别忘了复习", date:"2026-11-02", time:"08:30", loc:"各教学楼", color:"#6a8dff", remind:true },
  { id:"ev06", name:"校运动会", date:"2026-11-20", time:"08:30", loc:"学校田径场", color:"#2fc1a0", remind:true },
  { id:"ev07", name:"全国大学英语四六级考试", date:"2026-12-19", time:"08:30", loc:"教学楼（以准考证为准）", color:"#e57373", remind:true },
  { id:"ev08", name:"元旦晚会 · 跨年祭", date:"2026-12-31", time:"19:00", loc:"学校大礼堂", color:"#4fb7f7", remind:true },
  { id:"ev09", name:"期末考试周开始 · 一切以教务通知为准", date:"2027-01-11", time:"08:30", loc:"各考场", color:"#c94f6d", remind:true },
];

let events = loadEvents();
let eventRemindOn = localStorage.getItem("animeScheduleEventOn") === "1";
let eventTimes = loadJSON("animeScheduleEventTimes", [1440, 120, 30]);
let audioCtx = null;

function loadJSON(key, def) {
  try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : def; } catch (e) { return def; }
}
function loadEvents() {
  try {
    const raw = localStorage.getItem("animeScheduleEvents");
    if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr)) return arr; }
  } catch (e) {}
  return DEFAULT_EVENTS.slice();
}
function saveEvents() { localStorage.setItem("animeScheduleEvents", JSON.stringify(events)); }
function saveEventCfg() {
  localStorage.setItem("animeScheduleEventOn", eventRemindOn ? "1" : "0");
  localStorage.setItem("animeScheduleEventTimes", JSON.stringify(eventTimes));
}

// ================= DOM =================
const $ = id => document.getElementById(id);
const cdTimeEl = $("cdTime"), cdCourseEl = $("cdCourse"), toastEl = $("toast");
const evMaster = $("evMaster"), evListEl = $("evList");

// ================= 工具 =================
function eventDate(e) { return new Date(e.date + "T" + (e.time || "00:00") + ":00"); }
function pad(n) { return String(n).padStart(2, "0"); }
function fmtEventDate(d) {
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtEventGap(ms) {
  const min = Math.max(0, Math.floor(ms / 60000));
  if (min >= 1440) return Math.floor(min / 1440) + " 天 " + Math.floor(min % 1440 / 60) + " 小时";
  if (min >= 60) return Math.floor(min / 60) + " 小时 " + (min % 60) + " 分钟";
  return min + " 分钟";
}
function fmtHMS(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return pad(Math.floor(s/3600)) + ":" + pad(Math.floor(s%3600/60)) + ":" + pad(s%60);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function showToast(msg, ms = 5000) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), ms);
}
function nextEvent() {
  const now = new Date();
  let best = null;
  for (const e of events) {
    const d = eventDate(e);
    if (d >= now && (!best || d < eventDate(best))) best = e;
  }
  return best;
}

// ================= 铃声（与课程表页面一致） =================
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
}
function playChime() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let round = 0; round < 2; round++) {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = t0 + round * 0.9 + i * 0.16;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.55);
    });
  }
}
function playBell() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [880, 660, 880, 990, 1320].forEach((f, i) => {
    const t = t0 + i * 0.35;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 1.15);
  });
}
function playScale() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5].forEach((f, i) => {
    const t = t0 + i * 0.11;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  });
  [1046.5, 1318.5].forEach((f, i) => {
    const t = t0 + 0.95 + i * 0.18;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.65);
  });
}
function getRingtone() { return localStorage.getItem("animeScheduleRingtone") || "chime"; }
function playRingtone() {
  if (getRingtone() === "custom") {
    try {
      const src = localStorage.getItem("animeScheduleCustomRing");
      if (src) { new Audio(src).play().catch(() => {}); return; }
    } catch (e) {}
  }
  ensureAudio();
  const rt = getRingtone();
  if (rt === "bell") playBell();
  else if (rt === "up") playScale();
  else playChime();
}
const alerted = new Set();
function fireAlert(key, msg) {
  try {
    const map = JSON.parse(localStorage.getItem("animeScheduleAlerted") || "{}");
    const now = Date.now();
    for (const k in map) if (now - map[k] > 86400000) delete map[k];
    if (map[key]) return;
    map[key] = now;
    localStorage.setItem("animeScheduleAlerted", JSON.stringify(map));
  } catch (e) {
    if (alerted.has(key)) return;
    alerted.add(key);
  }
  playRingtone();
  showToast(msg, 8000);
}

// ================= 铃声设置 UI =================
function syncRingUI() {
  const rt = getRingtone();
  document.querySelectorAll('input[name="ring"]').forEach(r => { r.checked = r.value === rt; });
  $("ringCustomBox").style.display = rt === "custom" ? "flex" : "none";
  const src = localStorage.getItem("animeScheduleCustomRing");
  $("ringFileInfo").textContent = src ? "已上传自定义铃声 ♪" : "未上传";
}
document.querySelectorAll('input[name="ring"]').forEach(r => {
  r.addEventListener("change", () => {
    if (r.value === "custom" && !localStorage.getItem("animeScheduleCustomRing")) {
      showToast("请先上传自定义音频文件", 2500);
      r.checked = false;
      return;
    }
    localStorage.setItem("animeScheduleRingtone", r.value);
    syncRingUI();
    ensureAudio();
    playRingtone();
  });
});
$("ringFile").addEventListener("change", () => {
  const f = $("ringFile").files[0];
  if (!f) return;
  if (f.size > 1536 * 1024) {
    showToast("音频文件太大（需小于 1.5MB），请裁剪后再上传", 3500);
    $("ringFile").value = "";
    return;
  }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      localStorage.setItem("animeScheduleCustomRing", rd.result);
      localStorage.setItem("animeScheduleRingtone", "custom");
      syncRingUI();
      playRingtone();
      showToast("自定义铃声已保存并启用 ♪", 2500);
    } catch (e) {
      showToast("保存失败：浏览器存储空间不足，请换更小的文件", 3500);
    }
  };
  rd.readAsDataURL(f);
});
$("ringClear").onclick = () => {
  localStorage.removeItem("animeScheduleCustomRing");
  if (getRingtone() === "custom") localStorage.setItem("animeScheduleRingtone", "chime");
  syncRingUI();
  showToast("已清除自定义铃声，恢复默认", 2000);
};
$("ringTest").onclick = () => { ensureAudio(); playRingtone(); };

// ================= 提醒设置 UI =================
evMaster.checked = eventRemindOn;
evMaster.addEventListener("change", () => {
  eventRemindOn = evMaster.checked;
  saveEventCfg();
  if (eventRemindOn) { ensureAudio(); playRingtone(); showToast("活动声音提醒已开启 ♪", 2500); }
  else showToast("活动声音提醒已关闭", 2000);
});
$("evTestBtn").onclick = () => { ensureAudio(); playRingtone(); };

function syncTimeUI() {
  document.querySelectorAll(".evTime").forEach(cb => { cb.checked = eventTimes.includes(+cb.value); });
}
document.querySelectorAll(".evTime").forEach(cb => {
  cb.addEventListener("change", () => {
    const v = +cb.value;
    if (cb.checked) { if (!eventTimes.includes(v)) eventTimes.push(v); }
    else eventTimes = eventTimes.filter(t => t !== v);
    eventTimes.sort((a, b) => b - a);
    saveEventCfg();
  });
});

// ================= 活动列表 =================
function renderEventList() {
  events.sort((a, b) => eventDate(a) - eventDate(b));
  evListEl.innerHTML = "";
  const now = new Date();
  if (!events.length) {
    evListEl.innerHTML = '<div class="search-empty">还没有活动，在下方添加一个吧</div>';
    return;
  }
  events.forEach(e => {
    const d = eventDate(e);
    const past = d < now;
    const item = document.createElement("div");
    item.className = "r-item ev-item" + (past ? " past" : "");
    item.innerHTML =
      '<input type="checkbox"' + (e.remind && !past ? " checked" : "") + (past ? " disabled" : "") + '>' +
      '<span class="dot" style="background:' + (e.color || "#5aa9e6") + '"></span>' +
      '<span class="ev-main"><b>' + escapeHtml(e.name) + "</b>" +
      '<span class="sub">' + fmtEventDate(d) + " · " + escapeHtml(e.loc || "待定") + (past ? " · 已结束" : "") + "</span></span>" +
      '<button class="ev-del">删除</button>';
    const cb = item.querySelector("input");
    if (!past) cb.addEventListener("change", () => { e.remind = cb.checked; saveEvents(); });
    item.querySelector(".ev-del").onclick = () => {
      events = events.filter(x => x.id !== e.id);
      saveEvents();
      renderEventList();
      updateCountdown();
      showToast("已删除活动「" + e.name + "」", 2000);
    };
    evListEl.appendChild(item);
  });
}

$("evAddBtn").onclick = () => {
  const name = $("evInputName").value.trim();
  const date = $("evInputDate").value;
  const time = $("evInputTime").value || "00:00";
  const loc = $("evInputLoc").value.trim();
  if (!name || !date) { showToast("活动名称和日期都要填写哦", 2500); return; }
  const COLORS = ["#5aa9e6","#7fc4f5","#4fb7f7","#2fc1a0","#9b8ff7","#6a8dff","#f78eb0","#ffa45e"];
  events.push({
    id: "ev" + Date.now(),
    name, date, time, loc,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    remind: true
  });
  saveEvents();
  $("evInputName").value = "";
  $("evInputLoc").value = "";
  renderEventList();
  updateCountdown();
  showToast("活动「" + name + "」添加成功 ♪", 2500);
};

// ================= 倒计时 & 提醒 =================
function updateCountdown() {
  const e = nextEvent();
  if (!e) {
    cdTimeEl.textContent = "--:--:--";
    cdCourseEl.textContent = "暂无即将开始的活动";
    return;
  }
  const diff = eventDate(e) - new Date();
  cdTimeEl.textContent = fmtEventGap(diff);
  cdCourseEl.textContent = "🎉 " + e.name + " · " + fmtEventDate(eventDate(e)) + " · " + (e.loc || "待定");
}

function checkEventAlerts(now) {
  if (!eventRemindOn || !eventTimes.length) return;
  const thresholds = [...eventTimes].sort((a, b) => b - a);
  for (const e of events) {
    if (!e.remind) continue;
    const diff = eventDate(e) - now;
    if (diff <= 0 || diff > thresholds[0] * 60000) continue;
    thresholds.forEach((min, idx) => {
      const lower = idx + 1 < thresholds.length ? thresholds[idx + 1] : 0;
      if (diff <= min * 60000 && diff > lower * 60000) {
        const gapTxt = min >= 1440 ? Math.round(min / 1440) + " 天" : min + " 分钟";
        fireAlert("ev@" + e.id + "@" + e.date + "T" + e.time + "#" + min,
          "活动提醒：《" + e.name + "》还有 " + gapTxt + " 开始，地点 " + (e.loc || "待定") + " ♪");
      }
    });
  }
}

setInterval(() => {
  const now = new Date();
  checkEventAlerts(now);
  updateCountdown();
}, 1000);

// 课程表页面若同步修改数据，切回本页时刷新
window.addEventListener("focus", () => {
  events = loadEvents();
  eventTimes = loadJSON("animeScheduleEventTimes", [1440, 120, 30]);
  eventRemindOn = localStorage.getItem("animeScheduleEventOn") === "1";
  evMaster.checked = eventRemindOn;
  syncTimeUI();
  renderEventList();
  updateCountdown();
});

// ================= 初始化 =================
(function init() {
  syncRingUI();
  syncTimeUI();
  renderEventList();
  updateCountdown();
})();
</script>
</body>
</html>
